// No external dependencies, using built-in pinyin mapping

tasks.register("signJar", SignJar)
signJar.setGroup("build")

tasks.register("updateJSON", UpdateJson)
updateJSON.setGroup("publishing")
jar.finalizedBy(updateJSON)

// Data generation tasks disabled - using pre-generated resources
// tasks.register("data", Data)
// data.setGroup("build")
// processResources.dependsOn(data)

tasks.register("publish", Publish) {
    setGroup("publishing")
    dependsOn(jar)
}

// Note: Using direct dependency inclusion without shadow plugin to avoid Java 21 compatibility issues